<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг цен</title>
    <style>
        @import url('templates/style.css');
    </style>
</head>
<body>
    <div class="frame">
        <h1>История</h1>
        <div class="container">
            <h3>История цен</h3>
            <select id="historyPeriod" onchange="loadHistory(this.value)">
                <option value="1">За день</option>
                <option value="7" selected>За неделю</option>
                <option value="30">За месяц</option>
                <option value="all">Всё время</option>
            </select>
            <div id="history">
                <!-- Сюда будет подгружаться история -->
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;

        async function fetchWithAuth(url, options = {}) {
            let response = await fetch(url, options);
            if (response.status === 401 || response.status ===422) {
                const refreshResponse = await fetch('/refresh', { method: 'POST' });
                console.log(refreshResponse.status)
                if (refreshResponse.status!==401) {
                    response = await fetch(url, options); // повторяем запрос
                } else {
                    window.location.href = '/'; // refresh тоже истёк
                }
            }
            return response;
        }

        async function loadHistory(period) {
            const response = await fetchWithAuth('/history?period='+period, 
            {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 'page':currentPage}),
            }
            );
            const data = await response.json();
            const container = document.getElementById('history');
            container.innerHTML = '';

            if (!data.history || data.history.length === 0) {
                container.innerHTML = '<div class="empty">История пуста</div>';
                return;
            }

            data.history.forEach(item => {
                container.innerHTML += `
                    <div class="product">
                        <div class="product-info">
                            <h3>${item.product_name}</h3>
                            <div class="meta">${item.price} ₽ — ${item.checked_at}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML+=`
            <button onclick="loadHistory(7)">Смотреть дальше</button>
            `
            currentPage++;
            console.log(currentPage)
        }

        loadHistory(7);
    </script>
</body>
</html>
