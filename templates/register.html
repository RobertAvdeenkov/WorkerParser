<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Регистрация</title>

    </head>
    <style>
        :root {
            --bg: #0d0d0d;
            --bg-elevated: #1a1a1a;
            --bg-input: #262626;
            --accent: #ffcc00;
            --accent-hover: #e6b800;
            --border: #333;
            --text-muted: #888;
            --price: #4caf50;
            --danger: #f44336;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, var(--bg) 70%);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            color: #eee;
        }

        .frame {
            border: 3px solid var(--accent);
            border-radius: var(--radius);
            padding: 24px 32px;
            text-align: center;
            max-width: 900px;
            width: 100%;
            background: rgba(255, 204, 0, 0.02);
            box-shadow:
                0 0 0 6px rgba(255, 204, 0, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.6);
        }

        h1, h2, h3 {
            color: var(--accent);
            margin: 10px 0;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 28px;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.35);
        }

        .container {
            background-color: var(--bg);
            text-align: center;
            min-width: 40%;
            height: auto;
            padding: 16px;
            border-radius: var(--radius);
        }

        .ots {
            padding: 8px 12px;
        }

        button {
            border-radius: var(--radius);
            background-color: var(--accent);
            color: #000;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        input, select {
            color: var(--accent);
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: var(--radius);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            width: 90%;
            margin-bottom: 10px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.15);
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        .product {
            border: 1px solid var(--border);
            padding: 14px 16px;
            margin: 10px 0;
            text-align: left;
            background: var(--bg-elevated);
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s ease, transform 0.15s ease;
        }

        .product:hover {
            border-color: rgba(255, 204, 0, 0.5);
            transform: translateY(-2px);
        }

        .product-info {
            flex: 1;
        }

        .product h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }

        .product .price {
            color: var(--price);
            font-weight: bold;
            font-size: 16px;
        }

        .product .price-drop {
            color: var(--danger);
        }

        .product .meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .logout {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .logout a {
            color: var(--danger);
        }

        .empty {
            color: var(--text-muted);
            font-style: italic;
            margin: 20px 0;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: var(--radius);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
    <div class="frame">
        <h1>Здравствуйте!</h1>
        <div class="container">
            <form action="/reg" method="POST" id="loginForm">
                <h2>Логин</h2>
                <input name="name" placeholder="Имя" required>
                <p></p>
                <h2>Пароль</h2>
                <input name="password" type="password" placeholder="Пароль" required>
                <p></p>
                <button type="submit">Войти</button>
            </form>
            <p></p>
            <a href="/">Уже есть аккаунт? Логин</a>
        </div>
    </div>
    <p></p>
    <script>
    </script>
</html>
